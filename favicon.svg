<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgMech" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bgMech)"/>

  <g fill="#FFF7ED">
    <!-- gear teeth -->
    <g>
      <rect x="238" y="88"  width="36" height="64" rx="10"/>
      <rect x="238" y="360" width="36" height="64" rx="10"/>
      <rect x="88"  y="238" width="64" height="36" rx="10"/>
      <rect x="360" y="238" width="64" height="36" rx="10"/>
      <rect x="238" y="88"  width="36" height="64" rx="10" transform="rotate(45 256 256)"/>
      <rect x="238" y="360" width="36" height="64" rx="10" transform="rotate(45 256 256)"/>
      <rect x="88"  y="238" width="64" height="36" rx="10" transform="rotate(45 256 256)"/>
      <rect x="360" y="238" width="64" height="36" rx="10" transform="rotate(45 256 256)"/>
    </g>
    <!-- gear body -->
    <circle cx="256" cy="256" r="118"/>
  </g>
  <circle cx="256" cy="256" r="56" fill="#C2410C"/>
  <circle cx="256" cy="256" r="26" fill="#FFF7ED"/>
</svg>
